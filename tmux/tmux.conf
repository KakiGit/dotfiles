# Managed in ~/dotfiles/tmux/tmux.conf (linked to ~/.tmux.conf by setup.sh).
# Machine-specific overrides go in ~/.config/tmux/config.d/*.conf (decrypted
# from hosts/<id>/ by setup.sh).
#
# Quick reference: prefix is C-x. Hit prefix, then Space for the which-key
# menu showing every available key.

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -sa terminal-features ",*:RGB"      # true colour in panes (tmux >= 3.2)
set -s set-clipboard on                 # yank -> system clipboard via OSC 52
                                        # (works in ghostty and through ssh)
set -g history-limit 40000
set -g default-shell /bin/zsh
set -g mouse on
set -g escape-time 0                    # instant Esc for vim
set -g focus-events on
set -g display-time 2000
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity off
set -g renumber-windows on              # renumber after closing a window
set -g base-index 1                     # windows start at 1
setw -g pane-base-index 1               # panes start at 1
setw -g automatic-rename on
setw -g mode-keys vi

# ── Prefix: C-x ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-x
bind C-x send-prefix                    # C-x C-x sends C-x through

# ── Panes ───────────────────────────────────────────────────────────────────
# splits, in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# navigation: prefix + hjkl, or Alt + hjkl without any prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize, repeatable (keep pressing after the first hit)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ─────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Left previous-window
bind -n S-Right next-window

# ── Copy mode (vi) ──────────────────────────────────────────────────────────
# v starts selection, y yanks to the system clipboard, Esc cancels
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Misc ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind t display-popup -d "#{pane_current_path}" -w 80% -h 75%  # scratch shell

# ── Status bar (onedark, to match nvim) ─────────────────────────────────────
# palette: bg #282c34 · surface #3e4451 · fg #abb2bf · dim #5c6370
#          blue #61afef · yellow #e5c07b · red #e06c75
# Needs a nerd font for the powerline glyph ; replace it with ' ' if not.

set -g status-style "bg=#282c34,fg=#abb2bf"

# left: session chip, then the window list
set -g status-left-length 60
set -g status-left "#[fg=#282c34,bg=#61afef,bold]  #S #[fg=#61afef,bg=#3e4451]"
set -g window-status-separator ""
set -g window-status-format "#[fg=#abb2bf,bg=#3e4451] #I #W "
set -g window-status-current-format "#[fg=#282c34,bg=#61afef,bold] #I #W "
set -g window-status-activity-style "fg=#e5c07b,bg=#3e4451"
set -g window-status-bell-style "fg=#e06c75,bg=#3e4451"

# right: host and date
set -g status-right-length 80
set -g status-right "#[fg=#3e4451,bg=#282c34]#[fg=#abb2bf,bg=#3e4451] #H  %a %d %b  %H:%M #[fg=#3e4451,bg=#282c34]"

# panes, popups and modes
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-lines heavy          # tmux >= 3.2
set -g popup-border-style "fg=#61afef"
set -g popup-border-lines rounded       # tmux >= 3.3
set -g mode-style "bg=#3e4451,fg=#abb2bf"
set -g message-style "bg=#61afef,fg=#282c34,bold"
set -g message-command-style "bg=#61afef,fg=#282c34,bold"
set -g clock-mode-colour "#61afef"
set -g display-panes-active-colour "#61afef"
set -g display-panes-colour "#abb2bf"
set -g display-panes-time 2000

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
# which-key hint menus: hit prefix, then Space. The menu is defined in
# tmux/which-key.yaml in the dotfiles, linked by setup.sh to
# ~/.config/tmux/plugins/tmux-which-key/config.yaml
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "alexwforsythe/tmux-which-key"
set -g @tmux-which-key-xdg-enable 1     # read config from ~/.config/tmux/...

# Machine-specific config (decrypted from hosts/<id>/ by setup.sh)
source-file -q ~/.config/tmux/config.d/*.conf

# TPM must stay the last line
run "~/.tmux/plugins/tpm/tpm"
