# Managed in ~/dotfiles/tmux/tmux.conf (linked to ~/.tmux.conf by setup.sh).
# Machine-specific overrides go in ~/.config/tmux/config.d/*.conf (decrypted
# from hosts/<id>/ by setup.sh).
#
# Quick reference: prefix is C-x. Hit prefix, then Space for the which-key
# menu showing every available key.

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -sa terminal-features ",*:RGB"      # true colour in panes (tmux >= 3.2)
set -s set-clipboard on                 # yank -> system clipboard via OSC 52
                                        # (works in ghostty and through ssh)
set -g history-limit 40000
# Prefer fish, then zsh; if neither exists keep the login shell. (run-shell
# without -b is synchronous, so this lands before the first pane is created)
run-shell 'if p=$(command -v fish); then tmux set -g default-shell "$p"; elif p=$(command -v zsh); then tmux set -g default-shell "$p"; fi'
set -g mouse on
set -g escape-time 0                    # instant Esc for vim
set -g focus-events on
set -g display-time 2000
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity off
set -g renumber-windows on              # renumber after closing a window
set -g base-index 1                     # windows start at 1
setw -g pane-base-index 1               # panes start at 1
setw -g automatic-rename off
setw -g mode-keys vi

# ── Prefix: C-x ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-x
bind C-x send-prefix                    # C-x C-x sends C-x through

# ── Panes ───────────────────────────────────────────────────────────────────
# splits, in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# navigation: prefix + hjkl, or Alt + hjkl without any prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize, repeatable (keep pressing after the first hit)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ─────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Left previous-window
bind -n S-Right next-window

# ── Default session layout ──────────────────────────────────────────────────
# Every new session gets two windows: "sandbox" (window 1, starts the sandbox
# shell) and "host" (window 2, a plain shell). Exiting the sandbox drops back
# to a host shell in window 1. Skipped when the sandbox script is not present
# or we are already inside a sandbox container, so those sessions stay plain.
set-hook -g session-created {
    if-shell '[ -x ~/sandbox/sandbox.sh ] && [ -z "${SANDBOX_IN_CONTAINER:-}" ]' {
        rename-window sandbox
        send-keys 'sandbox' Enter
        new-window -n host
        select-window -t 1
    }
}

# ── Copy mode (vi) ──────────────────────────────────────────────────────────
# v starts selection, y yanks to the system clipboard, Esc cancels
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Misc ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind t display-popup -d "#{pane_current_path}" -w 80% -h 75%  # scratch shell

# ── Status bar & theme ──────────────────────────────────────────────────────
set -g status-position top              # tabs and status live at the top edge
set -g display-panes-time 2000
set -g popup-border-lines rounded       # tmux >= 3.3; oasis sets popup colours
set -g window-status-current-style "default"  # tmux 3.8 defaults to underline;
                                        # oasis styles the tabs inline instead

# Colors, status line, mode indicator and pane borders come from the oasis
# theme loaded by TPM below. The layout is configurable, e.g.
#   set -g @oasis_status_right "sync folder | git | clock"
# See https://github.com/uhs-robert/tmux-oasis for all options.

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
# which-key hint menus: hit prefix, then Space. The menu is defined in
# tmux/which-key.yaml in the dotfiles, linked by setup.sh to
# ~/.config/tmux/plugins/tmux-which-key/config.yaml
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "alexwforsythe/tmux-which-key"
set -g @tmux-which-key-xdg-enable 1     # read config from ~/.config/tmux/...

# oasis theme (loaded by TPM): desert status line with round window tabs
set -g @plugin "uhs-robert/tmux-oasis"
set -g @oasis_flavor "desert_dark"
set -g @oasis_separator "round"         # group separators match the round caps

# Machine-specific config (decrypted from hosts/<id>/ by setup.sh)
source-file -q ~/.config/tmux/config.d/*.conf

# TPM must stay the last line
run "~/.tmux/plugins/tpm/tpm"
