# yaml-language-server: $schema=config.schema.yaml
# which-key menu for tmux — opened with prefix (C-x) + Space.
# This file lives in the dotfiles; setup.sh links it to
# ~/.config/tmux/plugins/tmux-which-key/config.yaml, and the plugin rebuilds
# its menus from it on every load.

command_alias_start_index: 200

keybindings:
  prefix_table: Space
  # Uncomment to also open the menu without the prefix:
  # root_table: C-Space

title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=#61afef,align=centre,bold

# Menu position (both keys are required by the plugin's builder)
position:
  x: C   # centre
  y: C   # centre

custom_variables: []

macros:
  - name: reload-config
    commands:
      - display "Reloading tmux.conf..."
      - source-file $HOME/.tmux.conf
      - display "tmux.conf reloaded"

items:
  # ── everyday ────────────────────────────────────────────────────────────
  - name: Run command
    key: space
    command: command-prompt
  - name: Copy mode (v select, y yank)
    key: c
    command: copy-mode
  - name: Paste buffer
    key: b
    command: choose-buffer -Z
  - name: Scratch shell popup
    key: t
    command: 'display-popup -d "#{pane_current_path}" -w 80% -h 75%'
  - separator: true
  # ── panes ───────────────────────────────────────────────────────────────
  - name: +Panes
    key: p
    menu:
      - name: Left (Alt+h)
        key: h
        command: selectp -L
      - name: Down (Alt+j)
        key: j
        command: selectp -D
      - name: Up (Alt+k)
        key: k
        command: selectp -U
      - name: Right (Alt+l)
        key: l
        command: selectp -R
      - separator: true
      - name: Split side-by-side (|)
        key: /
        command: 'splitw -h -c #{pane_current_path}'
      - name: Split stacked (-)
        key: '-'
        command: 'splitw -v -c #{pane_current_path}'
      - name: Zoom
        key: z
        command: resizep -Z
      - name: +Resize (r to repeat)
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L 5
            transient: true
          - name: Down
            key: j
            command: resizep -D 5
            transient: true
          - name: Up
            key: k
            command: resizep -U 5
            transient: true
          - name: Right
            key: l
            command: resizep -R 5
            transient: true
          - separator: true
          - name: Left big
            key: H
            command: resizep -L 20
            transient: true
          - name: Down big
            key: J
            command: resizep -D 20
            transient: true
          - name: Up big
            key: K
            command: resizep -U 20
            transient: true
          - name: Right big
            key: L
            command: resizep -R 20
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break out to window
        key: '!'
        command: breakp
      - separator: true
      - name: Kill pane
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
  # ── windows ─────────────────────────────────────────────────────────────
  - name: +Windows
    key: w
    menu:
      - name: New
        key: c
        command: 'neww -c #{pane_current_path}'
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous (Shift+Left)
        key: p
        command: previous-window
      - name: Next (Shift+Right)
        key: n
        command: next-window
      - separator: true
      - name: Rename
        key: ','
        command: command-prompt -p "Rename window:" -I "#W" "renamew -- \"%%\""
      - name: Kill window
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectnl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
  # ── sessions ────────────────────────────────────────────────────────────
  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: command-prompt -p "Rename session:" -I "#S" "rename-session -- \"%%\""
      - name: Detach
        key: d
        command: detach
  - separator: true
  # ── misc ────────────────────────────────────────────────────────────────
  - name: Reload config
    key: r
    macro: reload-config
  - name: Show all keybindings
    key: '?'
    command: list-keys -N
