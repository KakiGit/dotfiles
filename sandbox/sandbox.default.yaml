service: sandbox
shell: fish

# Default container runtime; override with CONTAINER_RUNTIME=podman|docker.
runtime: podman

# Base settings merged onto the service, per runtime.
base:
  network_mode: host
  # Stable identity inside the sandbox: the container hostname is random and
  # must not leak into dotfiles' host id (setup.sh uses DOTFILES_HOST).
  hostname: sandbox
  environment:
    - DOTFILES_HOST=sandbox
    - TZ=${SANDBOX_TZ:-UTC}
  runtimes:
    podman:
      userns_mode: keep-id
      security_opt: [label=disable]
    docker:
      user: "${USER_UID}:${USER_GID}"

features: [home, wayland, x11, audio, gpu, gpg, yubikey]

# Host paths mirrored into the container at the same path. A bare path uses the
# same target and the "z" option; use {source, target, options} for full control.
mounts:
  - ~/.config/opencode
  - ~/.local/share/opencode
  - ~/.opencode
  - ~/.agents
  - ~/Github
  - ~/worktrees

# Feature sets are arbitrary compose service fragments. Any mapping may carry a
# `runtimes:` block with per-runtime overrides (applied when that runtime is active).
feature_sets:
  home:
    volumes:
      - "./sandbox_home:${HOME}:z"
  wayland:
    environment:
      - "WAYLAND_DISPLAY=${WAYLAND_DISPLAY}"
      - "XDG_RUNTIME_DIR=/tmp"
    volumes:
      - "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/${WAYLAND_DISPLAY}:z"
  x11:
    environment:
      - "DISPLAY=${DISPLAY-:0}"
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:z"
  audio:
    environment:
      - "PULSE_SERVER=unix:/tmp/pulse-native"
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - "${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse-native:z"
  gpg:
    # Forward the host gpg-agent: the container's ~/.gnupg is the host's, so
    # gpg/ssh in the sandbox reach the YubiKey through the host agent and
    # pinentry/touch prompts appear on the host, not in the sandbox.
    volumes:
      - "${HOME}/.gnupg:${HOME}/.gnupg:z"
    environment:
      - "SSH_AUTH_SOCK=${HOME}/.gnupg/S.gpg-agent.ssh"
  yubikey:
    # Raw USB access for ykman/PIV/FIDO2; device paths (CCID usb node + hidraw)
    # are detected at render time by sandbox.py and nothing is added when no
    # YubiKey is plugged in. CCID has a single owner: while a container-side
    # pcscd holds the card (sudo pcscd --disable-polkit), host-side card access
    # is blocked; hidraw and the forwarded agent above coexist with the host.
    devices: []
  gpu:
    runtimes:
      podman:
        environment:
          - "NVIDIA_VISIBLE_DEVICES=all"
          - "NVIDIA_DRIVER_CAPABILITIES=all"
        devices:
          - "nvidia.com/gpu=all"
      docker:
        deploy:
          resources:
            reservations:
              devices:
                - {driver: nvidia, count: all, capabilities: [gpu]}
